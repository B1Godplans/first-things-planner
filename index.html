<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="First Things">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111714" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>First Things Planner</title>
<style>
/* Layout: a field-journal planner. Left rail on iPad, bottom tabs on iPhone, one calm writing column. */
:root{
  --bg:#ECF0EA; --surface:#F8FAF6; --sunk:#E1E7DF; --ink:#1B2621; --muted:#58685F; --faint:#8A978F; --line:#CDD6CC;
  --accent:#8A5E17; --accent-soft:#F0E3C9; --accent-ink:#FFFFFF;
  --t1:#AE3D2A; --t2:#8A5E17; --t3:#2B5B84; --t4:#4C7560;
  --t1-soft:#F6DDD7; --t2-soft:#F0E3C9; --t3-soft:#DCE7F1; --t4-soft:#DDEAE1;
  --good:#2F7049; --good-soft:#D6EBDD; --warn:#9C6A12; --bad:#AE3D2A;
  --display:"Avenir Next","Avenir",-apple-system,"Segoe UI",system-ui,sans-serif;
  --ui:-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --serif:"Iowan Old Style","Palatino","Book Antiqua",Georgia,serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111714; --surface:#19211D; --sunk:#222C27; --ink:#E3EAE4; --muted:#9DABA3; --faint:#728078; --line:#2D3833;
    --accent:#D6A653; --accent-soft:#3A2F1C; --accent-ink:#1A1408;
    --t1:#E57A64; --t2:#D6A653; --t3:#7EAEDB; --t4:#8DBB9E;
    --t1-soft:#3D2420; --t2-soft:#3A2F1C; --t3-soft:#1E2E3D; --t4-soft:#1F3127;
    --good:#73C08F; --good-soft:#1E3326; --warn:#D9A24A; --bad:#E57A64;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#19211D; --sunk:#222C27; --ink:#E3EAE4; --muted:#9DABA3; --faint:#728078; --line:#2D3833;
  --accent:#D6A653; --accent-soft:#3A2F1C; --accent-ink:#1A1408;
  --t1:#E57A64; --t2:#D6A653; --t3:#7EAEDB; --t4:#8DBB9E;
  --t1-soft:#3D2420; --t2-soft:#3A2F1C; --t3-soft:#1E2E3D; --t4-soft:#1F3127;
  --good:#73C08F; --good-soft:#1E3326; --warn:#D9A24A; --bad:#E57A64;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{color-scheme:light;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:flex;min-height:100%}
.rail{display:none}
.main{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(88px + env(safe-area-inset-bottom,0px))}
.col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* bottom tabs (phone) */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:8px;color:var(--muted);font-size:11.5px;font-weight:600;letter-spacing:.02em}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

@media (min-width:760px){
  .tabs{display:none}
  .rail{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;max-height:100vh;width:212px;flex:none;
    padding:22px 12px 22px max(16px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--surface)}
  .rail .brand{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1.15;padding:0 10px 18px}
  .rail .brand small{display:block;font-family:var(--ui);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:4px}
  .rail .tab{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:10px 12px;letter-spacing:0}
  .rail .tab[aria-current="page"]{background:var(--accent-soft)}
  .rail .status{margin-top:auto;padding:0 10px}
  .main{padding-block:28px 48px}
  .phone-status{display:none}
}

/* type */
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1;font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:16.5px;font-weight:700}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.top .when{display:flex;flex-direction:column;gap:4px;min-width:0}
.pager{display:flex;align-items:center;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.icon-btn svg{width:18px;height:18px}
.chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.date-input{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:16px;max-width:170px}
.phone-status{font-size:12.5px;color:var(--muted)}

/* score strip */
.score{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.score div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.score b{display:block;font-family:var(--display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.score span{font-size:12.5px;color:var(--muted)}

/* inspiration */
.word{border-left:3px solid var(--accent);padding:4px 0 4px 16px;display:flex;flex-direction:column;gap:6px}
.word q{font-family:var(--serif);font-size:20px;line-height:1.4;quotes:none}
.word .src{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.word .apply{font-size:14px;color:var(--muted)}
.epi{font-family:var(--serif);font-style:italic;font-size:15.5px;color:var(--muted);line-height:1.45}
.epi cite{font-style:normal;font-family:var(--ui);font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--accent);margin-left:6px}

/* sections */
.sec{display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-head .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:14.5px}
.hint{font-size:13px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}

textarea,input[type=text],input[type=number],input[type=date],input[type=time],select{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:16px;min-width:0}
textarea{resize:none;overflow:hidden;font-family:var(--serif);font-size:17.5px;line-height:1.45;display:block}
textarea::placeholder,input::placeholder{color:var(--faint)}
textarea.big{min-height:84px}
input[type=number]{font-variant-numeric:tabular-nums}
.panel textarea,.panel input,.panel select{background:var(--bg)}

/* growing lists */
.list{display:flex;flex-direction:column;gap:6px}
.list .row{display:flex;gap:8px;align-items:flex-start}
.list.numbered{counter-reset:n}
.list.numbered .row::before{counter-increment:n;content:counter(n);font-family:var(--display);font-weight:700;color:var(--accent);width:18px;flex:none;padding-top:10px;text-align:right;font-variant-numeric:tabular-nums}
.list .row:last-child textarea{border-style:dashed}
.check{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;margin-top:8px;border:2px solid var(--line);border-radius:7px;background:var(--surface);display:grid;place-items:center}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:7px;height:12px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.done textarea{text-decoration:line-through;color:var(--muted)}

/* tasks */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.tier{border:0;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap;flex:none}
.tier.t1{background:var(--t1-soft);color:var(--t1)} .tier.t2{background:var(--t2-soft);color:var(--t2)}
.tier.t3{background:var(--t3-soft);color:var(--t3)} .tier.t4{background:var(--t4-soft);color:var(--t4)}
.legend .tier{cursor:default}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:start;padding:8px 10px 8px 8px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);border-left-width:4px}
.task.t1{border-left-color:var(--t1)} .task.t2{border-left-color:var(--t2)} .task.t3{border-left-color:var(--t3)} .task.t4{border-left-color:var(--t4)}
.task .check{margin-top:6px}
.task textarea{border:0;background:transparent;padding:6px 2px}
.task .meta{grid-column:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.task .meta select{width:auto;max-width:100%;font-size:14px;padding:4px 8px;border-radius:999px;background:var(--bg);color:var(--muted)}
.task.blank{border-style:dashed;border-left-style:solid}
.tasklist{display:flex;flex-direction:column;gap:8px}
.tier-help{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.tier-help div{font-size:13px;color:var(--muted);line-height:1.4}
.tier-help b{display:block;font-size:13px}

/* disciplines */
.disc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.disc .panel{gap:8px}
.disc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.met{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--sunk);color:var(--muted)}
.met.on{background:var(--good-soft);color:var(--good)}
.inline{display:flex;gap:8px;align-items:center}
.inline input[type=number]{width:96px}
.inline label{font-size:13.5px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair label{font-size:12.5px;color:var(--muted);display:block;margin-bottom:3px}
.dots{display:flex;gap:6px}
.dot{width:34px;height:34px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:700;font-size:13px;color:var(--muted)}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:18px;line-height:1}
.stepper b{min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}

/* segmented & chips */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.seg button.on.yes{background:var(--good);border-color:var(--good);color:var(--surface)}
.seg button.on.partly{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.seg button.on.no{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;text-align:left}
.chip.on{background:var(--t1-soft);border-color:var(--t1);color:var(--t1);font-weight:600}
.chip.add{border-style:dashed;color:var(--muted)}

/* notices */
.note{background:var(--accent-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.note .actions{display:flex;gap:8px;flex-wrap:wrap}

/* week */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daycell{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-variant-numeric:tabular-nums;min-width:0}
.daycell .dn{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.daycell .dd{font-family:var(--display);font-weight:700;font-size:19px}
.daycell .sm{font-size:11.5px;color:var(--muted)}
.daycell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mark{width:10px;height:10px;border-radius:999px;background:var(--sunk)}
.mark.yes{background:var(--good)} .mark.partly{background:var(--warn)} .mark.no{background:var(--bad)}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.saw{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

/* goals */
.htabs{display:flex;gap:6px;flex-wrap:wrap}
.htabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.htabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.htabs .c{font-variant-numeric:tabular-nums;opacity:.7;margin-left:4px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.goal>button.gsum{width:100%;background:none;border:0;text-align:left;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.goal .gt{font-family:var(--display);font-weight:700;font-size:16.5px;min-width:0;overflow-wrap:anywhere}
.goal .gm{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.goal .pct{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;color:var(--accent)}
.goal .gbody{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.danger{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px;font-size:13.5px;color:var(--bad);font-weight:600}
.danger.armed{background:var(--bad);color:var(--surface);border-color:var(--bad)}
input[type=range]{width:100%;accent-color:var(--accent)}
.status-done .gt{text-decoration:line-through;text-decoration-color:var(--good)}

/* growth */
.track{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;align-items:center}
.trow .tl{font-weight:600;font-size:14px}
.cells{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));grid-auto-rows:16px;gap:2px;align-items:stretch}
.cell{display:block;border-radius:3px;background:var(--sunk)}
.cell.part{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.cell.met{background:var(--good)}
.cell.yes{background:var(--good)} .cell.partly{background:var(--warn)} .cell.no{background:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stats b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stats span{font-size:12.5px;color:var(--muted)}
.targets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.targets label{font-size:13px;color:var(--muted);display:block;margin-bottom:3px}
.legend-row{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);align-items:center}
.legend-row i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* wisdom */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.wlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.wcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.wcard q{font-family:var(--serif);font-size:18px;line-height:1.45;quotes:none}
.wcard .src{font-size:12.5px;font-weight:700;color:var(--accent);letter-spacing:.03em}
.wcard .apply{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.wcard .kind{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.status-pill i{width:8px;height:8px;border-radius:999px;background:var(--faint)}
.status-pill.ok i{background:var(--good)} .status-pill.busy i{background:var(--warn)} .status-pill.err i{background:var(--bad)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (min-width:760px){.toast{bottom:24px}}
@media (prefers-reduced-motion:no-preference){.goal .bar i{transition:width .3s ease}}
/* handwritten notes */
.inkpad{display:flex;flex-direction:column;gap:10px}
.inktools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.inktools .grp{display:flex;gap:2px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.inktools .grp button{border:0;background:none;border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;color:var(--muted);min-height:34px}
.inktools .grp button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.inktools .grp button:disabled{opacity:.4}
.inktools .swatches{padding:4px 6px;gap:6px}
.inktools .grp button.swatch{width:28px;height:28px;min-height:0;padding:0;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.inktools .grp button.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ink-canvas{display:block;width:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

</style>
</head>
<body>

<div class="app">
  <nav class="rail" aria-label="Sections">
    <div class="brand">First Things<small>Planner</small></div>
    <div id="railTabs"></div>
    <div class="status"><span class="status-pill" id="status1"><i></i><span>Starting…</span></span></div>
  </nav>
  <main class="main" id="main"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div class="toast" id="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";

/* ---------------- store: private cloud sync with on-device copy ---------------- */
const S={mode:"local",db:null,base:"",cache:{},subs:{},ver:{},writing:{},again:{},timers:{},failed:false,range:null,rangeUnsub:null};
const LS="ftp1:";
function lsGet(k){try{const v=localStorage.getItem(LS+k);return v?JSON.parse(v):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(LS+k,JSON.stringify(v))}catch(e){if(!lsSet.warned){lsSet.warned=true;setTimeout(()=>toast("Couldn't save on this iPad. Free up storage, then save a backup."),0)}}}
function lsKeys(){const out=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(LS)) out.push(k.slice(LS.length))}}catch(e){}return out}

function doc(key){
  if(!S.cache[key]){const m=lsGet(key);S.cache[key]=mergeDefaults(defFor(key),m?m.data:null)}
  watch(key);
  return S.cache[key];
}
function peekDay(date){const k="d-"+date;if(S.cache[k]) return S.cache[k];const m=lsGet(k);return m?mergeDefaults(defFor(k),m.data):null}

function change(key,fn){
  const d=S.cache[key]||doc(key);fn(d);
  S.ver[key]=(S.ver[key]||0)+1;
  lsSet(key,{data:d,synced:false,ts:Date.now()});
  if(S.mode==="cloud") schedule(key,700);
  localChanged(key);
}
function schedule(key,ms){clearTimeout(S.timers[key]);S.timers[key]=setTimeout(()=>{S.timers[key]=null;flush(key)},ms);setStatus()}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function flush(key){
  if(S.mode!=="cloud") return;
  if(S.writing[key]){S.again[key]=true;return}
  S.writing[key]=true;setStatus();
  const v=S.ver[key];const body=clone(S.cache[key]);body.updatedAt=Date.now();
  const ref=S.db.collection(S.base).doc(key);
  let ok=false;
  try{await ref.set(body);ok=true}catch(e){
    if(e&&e.code==="unavailable"){await wait(700+Math.random()*1500);try{await ref.set(body);ok=true}catch(e2){}}
  }
  S.writing[key]=false;
  if(ok){S.failed=false;if(S.ver[key]===v) lsSet(key,{data:S.cache[key],synced:true,ts:body.updatedAt})}
  else S.failed=true;
  if(S.again[key]||S.ver[key]!==v){S.again[key]=false;if(!S.timers[key]) schedule(key,400)}
  setStatus();
}
function watch(key){
  if(S.mode!=="cloud"||S.subs[key]) return;
  const ref=S.db.collection(S.base).doc(key);
  S.subs[key]=ref.onSnapshot(snap=>applyRemote(key,snap),()=>{delete S.subs[key]});
}
function applyRemote(key,snap){
  if(snap.metadata&&snap.metadata.hasPendingWrites) return;
  if(S.timers[key]||S.writing[key]) return;
  const m=lsGet(key);
  if(!snap.exists){ if(m&&m.synced===false) schedule(key,50); return; }
  const data=snap.data();
  if(m&&m.synced===false&&(m.ts||0)>(data.updatedAt||0)){schedule(key,50);return}
  const merged=mergeDefaults(defFor(key),data);
  if(S.cache[key]&&stripMeta(merged)===stripMeta(S.cache[key])) return;
  S.cache[key]=merged;lsSet(key,{data:merged,synced:true,ts:data.updatedAt||0});
  remoteChanged(key);
}
function keepSubs(keys){
  for(const k of Object.keys(S.subs)){ if(!keys.includes(k)){try{S.subs[k]()}catch(e){} delete S.subs[k]} }
}
function watchRange(from,to){
  const id=from+"_"+to;if(S.range===id) return;S.range=id;
  if(S.rangeUnsub){try{S.rangeUnsub()}catch(e){} S.rangeUnsub=null}
  if(S.mode!=="cloud") return;
  const q=S.db.collection(S.base).where("kind","==","day").where("date",">=",from).where("date","<=",to);
  S.rangeUnsub=q.onSnapshot(qs=>{let any=false;for(const ds of qs.docs){const key=ds.id;if(S.timers[key]||S.writing[key]) continue;const m=lsGet(key);const data=ds.data();if(m&&m.synced===false&&(m.ts||0)>(data.updatedAt||0)) continue;const merged=mergeDefaults(defFor(key),data);if(S.cache[key]&&stripMeta(merged)===stripMeta(S.cache[key])) continue;S.cache[key]=merged;lsSet(key,{data:merged,synced:true,ts:data.updatedAt||0});any=true}if(any) remoteChanged("range")},()=>{S.rangeUnsub=null;S.range=null});
}
function pendingCount(){let n=0;for(const k in S.timers) if(S.timers[k]) n++;for(const k in S.writing) if(S.writing[k]) n++;return n}
function setStatus(){
  let cls="",txt;
  if(S.mode!=="cloud"){txt="Saved on this iPad";cls="ok"}
  else if(pendingCount()){txt="Saving…";cls="busy"}
  else if(S.failed){txt="Couldn't save. Will retry.";cls="err"}
  else {txt="Synced to your account";cls="ok"}
  for(const el of document.querySelectorAll(".status-pill")){el.className="status-pill "+cls;el.lastElementChild.textContent=txt}

async function allDocs(){

  for(const k of lsKeys()){if(k.startsWith("ui:")) continue;const m=lsGet(k);if(m&&!out[k]) out[k]=m.data}
  for(const k in S.cache) out[k]=S.cache[k];

// Strokes are stored as vectors in the iPad's IndexedDB, one page per day.

function inkDB(){
  if(INK.db) return INK.db;
  INK.db=new Promise((res,rej)=>{try{const r=indexedDB.open("ftp-ink",1);r.onupgradeneeded=()=>r.result.createObjectStore("pages");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
  return INK.db;
}
async function inkGet(key){
  if(INK.cache.has(key)) return INK.cache.get(key);
  let v=null;
  try{const db=await inkDB();v=await new Promise((res,rej)=>{const q=db.transaction("pages","readonly").objectStore("pages").get(key);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch(e){}
  if(INK.cache.has(key)) return INK.cache.get(key);
  const page=v&&Array.isArray(v.strokes)?v:{strokes:[],h:1400};
  INK.cache.set(key,page);return page;
}
async function inkPut(key,page){
  try{const db=await inkDB();await new Promise((res,rej)=>{const tx=db.transaction("pages","readwrite");const st=tx.objectStore("pages");if(page&&page.strokes.length) st.put(page,key);else st.delete(key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});return true}
  catch(e){toast("Couldn't save your handwriting. Free up storage, then save a backup.");return false}
}
function inkSave(key){clearTimeout(INK.saveT[key]);INK.saveT[key]=setTimeout(()=>{INK.saveT[key]=null;inkPut(key,INK.cache.get(key))},400)}
function inkFlush(){for(const k in INK.saveT){if(INK.saveT[k]){clearTimeout(INK.saveT[k]);INK.saveT[k]=null;inkPut(k,INK.cache.get(k))}}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden") inkFlush()});
window.addEventListener("pagehide",inkFlush);
async function inkAll(){
  const out={};
  try{const db=await inkDB();await new Promise((res,rej)=>{const q=db.transaction("pages","readonly").objectStore("pages").openCursor();q.onsuccess=()=>{const c=q.result;if(c){out[c.key]=c.value;c.continue()}else res()};q.onerror=()=>rej(q.error)})}catch(e){}
  for(const [k,v] of INK.cache) if(v&&v.strokes&&v.strokes.length) out[k]=v;
  return out;
}

  const fingerB=btn("",()=>{if(!st.penSeen){st.penSeen=true;flag("penSeen",true);st.finger=false}else st.finger=!st.finger;flag("fingerDraw",st.finger);paintTools();paintHint()});
  const clearB=h("button",{type:"button",class:"danger",text:"Clear page"});
  clearB.addEventListener("click",()=>{
    if(!page.strokes.length) return;
    if(!clearB.classList.contains("armed")){clearB.classList.add("armed");clearB.textContent="Tap again to clear";setTimeout(()=>{clearB.classList.remove("armed");clearB.textContent="Clear page"},3500);return}
    clearB.classList.remove("armed");clearB.textContent="Clear page";
    st.undo.push({type:"clear",strokes:page.strokes.slice(),h:page.h});st.redo=[];page.strokes=[];page.h=1400;commit();layout();
  });
  const tools=h("div",{class:"inktools"},toolGrp,colorGrp,sizeGrp,editGrp,h("div",{class:"grp"},fingerB),clearB);
  function paintTools(){
    toolGrp.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.t===st.tool)));
    colorGrp.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(st.tool==="pen"&&b.dataset.c===st.color)));
    sizeGrp.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(st.tool!=="eraser"&&Number(b.dataset.s)===st.size)));
    undoB.disabled=!st.undo.length;redoB.disabled=!st.redo.length;
    const fd=st.finger||!st.penSeen;fingerB.textContent=fd?"Finger draws":"Finger scrolls";fingerB.setAttribute("aria-pressed",String(fd));
  }
  wrap.append(tools,paper,hint);

  // drawing
  let colors={};
  const readColors=()=>{const cs=getComputedStyle(document.documentElement);colors={};for(const [k,v] of Object.entries(INK_COLORS)) colors[k]=cs.getPropertyValue("--"+v).trim()||"#222";colors.line=cs.getPropertyValue("--line").trim();colors.margin=cs.getPropertyValue("--t1-soft").trim()};
  function layout(){
    const cssW=paper.clientWidth;if(!cssW) return;
    scale=cssW/INK_W;const cssH=Math.round(page.h*scale);const dpr=window.devicePixelRatio||1;
    cv.style.height=cssH+"px";cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
    ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);draw();
  }
  function draw(){
    readColors();ctx.clearRect(0,0,INK_W,page.h);
    ctx.save();ctx.lineWidth=2;ctx.strokeStyle=colors.line;
    for(let y=INK_TOP;y<page.h;y+=INK_LINE){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(INK_W,y);ctx.stroke()}
    ctx.strokeStyle=colors.margin;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(150,0);ctx.lineTo(150,page.h);ctx.stroke();ctx.restore();
    for(const s of page.strokes) drawStroke(s);
    if(cur) drawStroke(cur);
  }
  const widthAt=(s,a,b)=>s.w*(0.55+((a+b)/200)*0.9);
  function drawStroke(s){
    const p=s.p;ctx.save();ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle=ctx.fillStyle=colors[s.c]||colors.ink;
    if(s.t==="hl"){ctx.globalAlpha=.32;ctx.lineWidth=s.w;ctx.beginPath();ctx.moveTo(p[0],p[1]);for(let i=3;i<p.length;i+=3) ctx.lineTo(p[i],p[i+1]);if(p.length===3) ctx.lineTo(p[0]+.1,p[1]);ctx.stroke();ctx.restore();return}
    if(p.length===3){ctx.beginPath();ctx.arc(p[0],p[1],widthAt(s,p[2],p[2])/2,0,Math.PI*2);ctx.fill();ctx.restore();return}
    for(let i=3;i<p.length;i+=3){ctx.lineWidth=widthAt(s,p[i-1],p[i+2]);ctx.beginPath();ctx.moveTo(p[i-3],p[i-2]);ctx.lineTo(p[i],p[i+1]);ctx.stroke()}
    ctx.restore();
  }
  function drawSeg(s,i){ctx.save();ctx.lineCap="round";ctx.strokeStyle=colors[s.c]||colors.ink;ctx.lineWidth=widthAt(s,s.p[i-1],s.p[i+2]);ctx.beginPath();ctx.moveTo(s.p[i-3],s.p[i-2]);ctx.lineTo(s.p[i],s.p[i+1]);ctx.stroke();ctx.restore()}
  function toUnits(e){const r=cv.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)/scale*2)/2,y:Math.round((e.clientY-r.top)/scale*2)/2,pr:e.pointerType==="pen"?Math.round(Math.min(1,Math.max(.05,e.pressure||.5))*100):50}}
  function hits(s,pt,R){const p=s.p,r=R+s.w/2;for(let i=0;i<p.length;i+=3){const dx=p[i]-pt.x,dy=p[i+1]-pt.y;if(dx*dx+dy*dy<=r*r) return true}return false}
  function eraseAt(pt){let any=false;for(let i=page.strokes.length-1;i>=0;i--){if(hits(page.strokes[i],pt,22)){removed.push({s:page.strokes[i],i});page.strokes.splice(i,1);any=true}}if(any) draw()}
  function grow(){let maxY=0;for(const s of page.strokes) for(let i=1;i<s.p.length;i+=3) if(s.p[i]>maxY) maxY=s.p[i];const need=Math.ceil((maxY+INK_LINE*6)/INK_LINE)*INK_LINE+INK_TOP;if(need>page.h){page.h=need;layout()}}
  function commit(){INK.cache.set(key,page);inkSave(key);paintTools()}
  function undo(){const a=st.undo.pop();if(!a) return;
    if(a.type==="add"){const i=page.strokes.lastIndexOf(a.s);if(i>=0) page.strokes.splice(i,1)}
    else if(a.type==="erase"){for(const it of a.items.slice().reverse()) page.strokes.splice(it.i,0,it.s)}
    else if(a.type==="clear"){page.strokes=a.strokes.slice();page.h=a.h}
    st.redo.push(a);commit();layout()}
  function redo(){const a=st.redo.pop();if(!a) return;
    if(a.type==="add") page.strokes.push(a.s);
    else if(a.type==="erase"){for(const it of a.items){const i=page.strokes.indexOf(it.s);if(i>=0) page.strokes.splice(i,1)}}
    else if(a.type==="clear"){page.strokes=[];page.h=1400}
    st.undo.push(a);commit();layout()}

  cv.addEventListener("pointerdown",e=>{
    if(active) return;
    if(e.pointerType==="pen"&&!st.penSeen){st.penSeen=true;flag("penSeen",true);paintHint()}
    if(e.pointerType==="touch"&&st.penSeen&&!st.finger){active={id:e.pointerId,scroll:true,y:e.clientY};return}
    e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    active={id:e.pointerId};readColors();const pt=toUnits(e);
    if(st.tool==="eraser"){removed=[];active.erase=true;eraseAt(pt);return}
    const hl=st.tool==="hl";
    cur={t:hl?"hl":"pen",c:hl?"hl":st.color,w:hl?40:INK_SIZES[st.size],p:[pt.x,pt.y,pt.pr]};
    if(!hl) drawStroke(cur);
  });
  cv.addEventListener("pointermove",e=>{
    if(!active||e.pointerId!==active.id) return;
    if(active.scroll){window.scrollBy(0,active.y-e.clientY);active.y=e.clientY;return}
    e.preventDefault();
    const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
    for(const ev of evs){const pt=toUnits(ev);
      if(active.erase){eraseAt(pt);continue}
      const p=cur.p,lx=p[p.length-3],ly=p[p.length-2];if((pt.x-lx)**2+(pt.y-ly)**2<4) continue;
      p.push(pt.x,pt.y,pt.pr);if(cur.t!=="hl") drawSeg(cur,p.length-3)}
    if(cur&&cur.t==="hl") draw();
  });
  const end=e=>{
    if(!active||e.pointerId!==active.id) return;const was=active;active=null;if(was.scroll) return;
    if(was.erase){if(removed.length){st.undo.push({type:"erase",items:removed});st.redo=[];commit()}removed=[];return}
    if(cur){page.strokes.push(cur);st.undo.push({type:"add",s:cur});st.redo=[];cur=null;commit();grow();draw()}
  };
  cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",end);
  cv.addEventListener("contextmenu",e=>e.preventDefault());

  new ResizeObserver(()=>layout()).observe(paper);
  inkRedraws.push(()=>draw());
  inkGet(key).then(p=>{page=p;layout()});
  paintTools();paintHint();
  return wrap;
}
try{const mq=matchMedia("(prefers-color-scheme: dark)");mq.addEventListener("change",()=>inkRedraws.forEach(f=>f()))}catch(e){}

/* ---------------- boot ---------------- */
async function boot(){
  S.booting=false;render();
  try{if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator&&navigator.serviceWorker.controller){let done=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(done) return;done=true;inkFlush();setTimeout(()=>location.reload(),300)})}
  if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){try{await navigator.serviceWorker.register("sw.js")}catch(e){}}
}
boot();
</script>
</body>
</html>
